<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - KubicKode Example</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script type="module" src="./kubic-kode-helper.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }

        .content {
            padding: 30px;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player-section {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9fa;
        }

        .player-section.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .choice-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .choice-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            text-align: center;
            padding: 20px;
            background: #e9ecef;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .emoji {
            font-size: 2em;
            margin: 0 10px;
        }

        .score {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container" x-data="rpsGame()" x-init="init()">
        <div class="header">
            <h1>🪨 📄 ✂️ Rock Paper Scissors</h1>
            <p>Powered by KubicKode</p>
        </div>

        <div class="content">
            <!-- Connection Status -->
            <div class="status-bar">
                <div x-show="!connected">
                    <strong>Status:</strong> Connecting to KubicKode server...
                </div>
                <div x-show="connected">
                    <strong>Status:</strong> Connected to KubicKode server
                    <span x-show="sessionId">| Session: <span x-text="sessionId"></span></span>
                </div>
            </div>

            <!-- Error Messages -->
            <div x-show="error" class="error" x-text="error"></div>
            <div x-show="success" class="success" x-text="success"></div>

            <!-- Game Setup -->
            <div x-show="!gameStarted && connected" class="game-area">
                <div class="player-section">
                    <h3>Player Setup</h3>
                    <input 
                        type="text" 
                        x-model="playerName" 
                        placeholder="Enter your name"
                        class="form-control"
                        style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; margin-bottom: 10px;"
                    >
                    <button 
                        @click="joinGame()" 
                        :disabled="!playerName || loading"
                        class="btn btn-primary"
                    >
                        <span x-show="!loading">Join Game</span>
                        <span x-show="loading">Joining...</span>
                    </button>
                </div>

                <div class="player-section">
                    <h3>Game Controls</h3>
                    <button 
                        @click="startGame()" 
                        :disabled="!canStartGame || loading"
                        class="btn btn-success"
                    >
                        <span x-show="!loading">Start Game</span>
                        <span x-show="loading">Starting...</span>
                    </button>
                    <br><br>
                    <button 
                        @click="resetGame()" 
                        class="btn btn-secondary"
                    >
                        Reset Game
                    </button>
                </div>
            </div>

            <!-- Active Game -->
            <div x-show="gameStarted" class="game-area">
                <div class="player-section" :class="{ 'active': isMyTurn }">
                    <h3>You <span x-text="playerName"></span></h3>
                    <div class="choice-buttons">
                        <button 
                            @click="makeChoice('rock')" 
                            :disabled="!isMyTurn || loading"
                            class="choice-btn"
                        >
                            🪨 Rock
                        </button>
                        <button 
                            @click="makeChoice('paper')" 
                            :disabled="!isMyTurn || loading"
                            class="choice-btn"
                        >
                            📄 Paper
                        </button>
                        <button 
                            @click="makeChoice('scissors')" 
                            :disabled="!isMyTurn || loading"
                            class="choice-btn"
                        >
                            ✂️ Scissors
                        </button>
                    </div>
                    <div class="score">
                        Score: <span x-text="playerScore"></span>
                    </div>
                </div>

                <div class="player-section">
                    <h3>Opponent</h3>
                    <div x-show="opponentChoice" class="result-text">
                        <span x-text="opponentChoice"></span>
                    </div>
                    <div x-show="!opponentChoice">
                        Waiting for opponent...
                    </div>
                    <div class="score">
                        Score: <span x-text="opponentScore"></span>
                    </div>
                </div>
            </div>

            <!-- Game Results -->
            <div x-show="gameResult" class="result-area">
                <div class="result-text" x-text="gameResult"></div>
                <div x-show="roundResult">
                    <span class="emoji" x-text="getResultEmoji()"></span>
                    <span x-text="roundResult"></span>
                    <span class="emoji" x-text="getResultEmoji()"></span>
                </div>
                <div class="controls">
                    <button @click="nextRound()" class="btn btn-primary">Next Round</button>
                    <button @click="endGame()" class="btn btn-secondary">End Game</button>
                </div>
            </div>

            <!-- Game History -->
            <div x-show="gameHistory.length > 0" style="margin-top: 30px;">
                <h3>Game History</h3>
                <div style="max-height: 200px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 10px;">
                    <div x-for="(round, index) in gameHistory" :key="index" style="margin-bottom: 10px; padding: 10px; background: white; border-radius: 5px;">
                        <strong>Round <span x-text="index + 1"></span>:</strong>
                        <span x-text="round.playerChoice"></span> vs <span x-text="round.opponentChoice"></span>
                        - <span x-text="round.result"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function rpsGame() {
            return {
                // Game state
                connected: false,
                sessionId: null,
                playerName: '',
                gameStarted: false,
                isMyTurn: false,
                loading: false,
                error: null,
                success: null,

                // Game data
                playerChoice: null,
                opponentChoice: null,
                gameResult: null,
                roundResult: null,
                playerScore: 0,
                opponentScore: 0,
                gameHistory: [],

                // Initialize the game
                async init() {
                    try {
                        // Configure KubicKode helper
                        KubicKode.configure({
                            apiPrefix: 'http://localhost:3000/api',
                            autoReconnect: true,
                            retryAttempts: 3
                        });

                        // Register the RPS game
                        KubicKode.game.register('rock-paper-scissors');

                        // Set up event listeners
                        KubicKode.events
                            .on('websocketConnected', () => {
                                this.connected = true;
                                this.showSuccess('Connected to KubicKode server');
                            })
                            .on('websocketDisconnected', () => {
                                this.connected = false;
                                this.showError('Disconnected from server');
                            })
                            .on('sessionInitialized', (data) => {
                                this.sessionId = data.sessionId;
                                this.showSuccess('Session initialized');
                            })
                            .on('kubic::gameStarted', (data) => {
                                this.gameStarted = true;
                                this.isMyTurn = data.currentPlayer === this.playerName;
                                this.showSuccess('Game started!');
                            })
                            .on('kubic::turnPlayed', (data) => {
                                this.handleTurnPlayed(data);
                            })
                            .on('kubic::gameEnded', (data) => {
                                this.handleGameEnded(data);
                            });

                        // Connect WebSocket
                        KubicKode.connectWebSocket();

                        // Initialize session
                        await this.initSession();

                    } catch (error) {
                        this.showError('Failed to initialize: ' + error.message);
                    }
                },

                // Initialize session
                async initSession() {
                    try {
                        this.loading = true;
                        const response = await KubicKode.initSession('rock-paper-scissors');
                        
                        if (response.success) {
                            this.sessionId = response.data.session_id;
                            this.showSuccess('Session created successfully');
                        }
                    } catch (error) {
                        this.showError('Failed to create session: ' + error.message);
                    } finally {
                        this.loading = false;
                    }
                },

                // Join the game
                async joinGame() {
                    if (!this.playerName.trim()) {
                        this.showError('Please enter your name');
                        return;
                    }

                    try {
                        this.loading = true;
                        const response = await KubicKode.joinSession(this.playerName, 'human');
                        
                        if (response.success) {
                            this.showSuccess('Joined game successfully');
                        }
                    } catch (error) {
                        this.showError('Failed to join game: ' + error.message);
                    } finally {
                        this.loading = false;
                    }
                },

                // Start the game
                async startGame() {
                    try {
                        this.loading = true;
                        const response = await KubicKode.startGame({
                            playStyle: 'competitive', // Example of play style configuration
                            maxRounds: 5
                        });
                        
                        if (response.success) {
                            this.gameStarted = true;
                            this.isMyTurn = response.data.currentPlayer === this.playerName;
                            this.showSuccess('Game started!');
                        }
                    } catch (error) {
                        this.showError('Failed to start game: ' + error.message);
                    } finally {
                        this.loading = false;
                    }
                },

                // Make a choice (rock, paper, scissors)
                async makeChoice(choice) {
                    if (!this.isMyTurn) return;

                    try {
                        this.loading = true;
                        this.playerChoice = choice;
                        
                        // Use the dynamic game method
                        const response = await KubicKode.rock_paper_scissors.playTurn(0, 0, {
                            choice: choice,
                            playerName: this.playerName
                        });
                        
                        if (response.success) {
                            this.isMyTurn = false;
                            this.showSuccess(`You chose ${choice}`);
                        }
                    } catch (error) {
                        this.showError('Failed to make choice: ' + error.message);
                        this.playerChoice = null;
                    } finally {
                        this.loading = false;
                    }
                },

                // Handle turn played event
                handleTurnPlayed(data) {
                    if (data.playerName !== this.playerName) {
                        this.opponentChoice = data.choice;
                    }
                    
                    // Check if both players have made their choices
                    if (this.playerChoice && this.opponentChoice) {
                        this.determineWinner();
                    }
                },

                // Determine the winner of the round
                determineWinner() {
                    const choices = {
                        rock: { beats: 'scissors', loses: 'paper' },
                        paper: { beats: 'rock', loses: 'scissors' },
                        scissors: { beats: 'paper', loses: 'rock' }
                    };

                    const playerChoice = choices[this.playerChoice];
                    const opponentChoice = choices[this.opponentChoice];

                    let result;
                    if (this.playerChoice === this.opponentChoice) {
                        result = 'Tie';
                        this.roundResult = "It's a tie!";
                    } else if (playerChoice.beats === this.opponentChoice) {
                        result = 'Win';
                        this.playerScore++;
                        this.roundResult = 'You win this round!';
                    } else {
                        result = 'Lose';
                        this.opponentScore++;
                        this.roundResult = 'Opponent wins this round!';
                    }

                    // Add to game history
                    this.gameHistory.push({
                        playerChoice: this.playerChoice,
                        opponentChoice: this.opponentChoice,
                        result: result
                    });

                    // Show result
                    this.gameResult = `Round Complete - ${result}`;
                },

                // Handle game ended event
                handleGameEnded(data) {
                    const winner = this.playerScore > this.opponentScore ? 'You' : 
                                 this.opponentScore > this.playerScore ? 'Opponent' : 'Tie';
                    
                    this.gameResult = `Game Over! ${winner} ${winner === 'Tie' ? 'tied' : 'won'}!`;
                    this.gameStarted = false;
                },

                // Next round
                nextRound() {
                    this.playerChoice = null;
                    this.opponentChoice = null;
                    this.gameResult = null;
                    this.roundResult = null;
                    this.isMyTurn = true;
                },

                // End game
                async endGame() {
                    try {
                        await KubicKode.route.game('stop');
                        this.resetGame();
                    } catch (error) {
                        this.showError('Failed to end game: ' + error.message);
                    }
                },

                // Reset the game
                resetGame() {
                    this.gameStarted = false;
                    this.isMyTurn = false;
                    this.playerChoice = null;
                    this.opponentChoice = null;
                    this.gameResult = null;
                    this.roundResult = null;
                    this.playerScore = 0;
                    this.opponentScore = 0;
                    this.gameHistory = [];
                    this.clearMessages();
                },

                // Utility methods
                get canStartGame() {
                    return this.sessionId && this.playerName && !this.gameStarted;
                },

                getResultEmoji() {
                    if (this.roundResult?.includes('win')) return '🎉';
                    if (this.roundResult?.includes('tie')) return '🤝';
                    return '😔';
                },

                showError(message) {
                    this.error = message;
                    this.success = null;
                    setTimeout(() => this.error = null, 5000);
                },

                showSuccess(message) {
                    this.success = message;
                    this.error = null;
                    setTimeout(() => this.success = null, 3000);
                },

                clearMessages() {
                    this.error = null;
                    this.success = null;
                }
            }
        }
    </script>
</body>
</html>
